name: Release QuickNotes

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: quicknotes-release
  cancel-in-progress: false

jobs:
  test:
    name: Test before publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up patched Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Validate stable release version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use a stable version such as v0.1.0 (not v1.0 or a prerelease)."
            exit 1
          fi
      - name: Vet and race-test QuickNotes
        working-directory: app
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Test deployment and measurement helpers
        run: python3 -m unittest discover -s scripts/lab10 -p 'test_*.py' -v

  publish:
    name: Publish multi-platform image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      version: ${{ steps.metadata.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Derive lowercase image name
        id: metadata
        shell: bash
        run: |
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/quicknotes"
          printf 'image=%s\nversion=%s\n' "$image" "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR with the job token
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish version and latest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.version }}
            ${{ steps.metadata.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
      - name: Record the release identity
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          VERSION: ${{ steps.metadata.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '## Published QuickNotes\n\n'
            printf -- '- Version: \x60%s:%s\x60\n' "$IMAGE" "$VERSION"
            printf -- '- Exact artifact: \x60%s@%s\x60\n' "$IMAGE" "$DIGEST"
            printf -- '- Platforms: linux/amd64 and linux/arm64\n'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy the published digest to Render
    needs: publish
    if: vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out deployment helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trigger Render with the exact published artifact
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: python3 scripts/lab10/deploy_render.py "$IMAGE_URL"
